[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-enrich"
version = "0.1.0"
description = "Single-indicator IP/domain threat-intelligence enrichment and triage across AbuseIPDB, VirusTotal, and URLhaus."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mukesh Kumar C", email = "mukeshkumarc0309@gmail.com" }]
keywords = ["security", "threat-intelligence", "ioc", "enrichment", "triage", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
ioc-enrich = "ioc_enrich.cli:main"

[project.urls]
Homepage = "https://github.com/MukeshKumarC-0309/IOC_Enrich"
Repository = "https://github.com/MukeshKumarC-0309/IOC_Enrich"

[tool.setuptools]
packages = ["ioc_enrich", "ioc_enrich.clients"]
